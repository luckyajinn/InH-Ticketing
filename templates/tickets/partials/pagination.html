{% if page.has_other_pages %}
<nav class="pagination" aria-label="Pages">
  <span>{% if page.has_previous %}<a href="{% querystring page=page.previous_page_number %}">&larr; Previous</a>{% endif %}</span>
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }}</span>
  <span>{% if page.has_next %}<a href="{% querystring page=page.next_page_number %}">Next &rarr;</a>{% endif %}</span>
</nav>
{% endif %}
