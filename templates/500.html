<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Something went wrong · InH-Ticketing</title>
  <style>
    /* Self-contained on purpose: this page must render even if static files can't be served. */
    :root {
      color-scheme: light;
      --bg: #f6f3ef; --surface: #ffffff; --border: #e6dfd6; --text: #2a2521; --muted: #685f56;
      --accent: #0e7c72; --accent-text: #ffffff; --accent-soft: #def2ee;
      --font: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      --font-display: ui-rounded, "SF Pro Rounded", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      --shadow: 0 1px 3px rgba(58, 40, 22, .05), 0 8px 24px rgba(58, 40, 22, .07);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --bg: #171411; --surface: #221e1a; --border: #3a332c; --text: #f1ebe4; --muted: #b9aea2;
        --accent: #3db5a5; --accent-text: #07201c; --accent-soft: #173431;
        --shadow: 0 1px 3px rgba(0, 0, 0, .32), 0 8px 24px rgba(0, 0, 0, .30);
      }
    }
    body { margin: 0; padding: 64px 16px; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.55; }
    main { max-width: 520px; margin: 0 auto; padding: 32px 28px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); text-align: center; }
    svg { width: 112px; height: auto; margin-bottom: 8px; }
    .blob { fill: var(--accent-soft); }
    .paper { fill: var(--surface); stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; }
    .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
    .dot { fill: var(--accent); }
    h1 { margin: 0 0 6px; font-family: var(--font-display); font-size: 22px; }
    p { margin: 0 0 8px; color: var(--muted); }
    a { display: inline-flex; align-items: center; min-height: 40px; margin-top: 12px; padding: 0 18px; border-radius: 999px; background: var(--accent); color: var(--accent-text); font-weight: 650; text-decoration: none; }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 120 96" aria-hidden="true" focusable="false">
      <circle class="blob" cx="60" cy="48" r="42"/>
      <circle class="paper" cx="60" cy="48" r="22"/>
      <path class="line" d="M60 37v13"/>
      <circle class="dot" cx="60" cy="58" r="2.2"/>
      <circle class="dot" cx="97" cy="24" r="3"/>
      <circle class="dot" cx="22" cy="66" r="2.2"/>
    </svg>
    <h1>Something went wrong</h1>
    <p>InH-Ticketing hit an error. Please try again in a minute. If it keeps happening, contact IT.</p>
    <a href="/">Back to home</a>
  </main>
</body>
</html>
