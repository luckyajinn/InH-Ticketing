# InH-Ticketing on Docker: the web app plus PostgreSQL.
#   docker compose up --build
# Then open http://localhost:8000. Settings come from .env (see .env.example).
# The worker sends queued emails, reads the inbox and closes resolved tickets.

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: inh
      POSTGRES_USER: inh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inh -d inh"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://inh:${POSTGRES_PASSWORD}@db:5432/inh
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media  # uploaded attachments; back this up with the database
    depends_on:
      db:
        condition: service_healthy
    # Apply database migrations, then start the web server.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://inh:${POSTGRES_PASSWORD}@db:5432/inh
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      web:
        # Healthy = the web container has applied the database updates and is
        # answering, so the worker never starts on a database that's out of date.
        condition: service_healthy
    command: python manage.py run_worker
    healthcheck:
      # Not the image's check (that one is for the web server). Healthy = the
      # worker finished a round in the last 5 minutes, from its heartbeat.
      # `docker compose ps` shows it; Reports shows the same, with details.
      test: ["CMD", "python", "manage.py", "check_worker"]
      interval: 60s
      timeout: 30s
      start_period: 60s
      retries: 3

volumes:
  pgdata:
  media:
