# InH-Ticketing on Docker: the web app plus PostgreSQL.
#   docker compose up --build
# Then open http://localhost:8000. Settings come from .env (see .env.example).
# The worker sends queued emails (and will read the inbox from milestone 4).

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: inh
      POSTGRES_USER: inh
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inh -d inh"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://inh:${POSTGRES_PASSWORD}@db:5432/inh
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media  # uploaded attachments; back this up with the database
    depends_on:
      db:
        condition: service_healthy
    # Apply database migrations, then start the web server.
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi --bind 0.0.0.0:8000 --workers 3 --access-logfile -"
    ports:
      - "8000:8000"

  worker:
    build: .
    restart: unless-stopped  # also restarts it if it starts before migrations finish
    env_file: .env
    environment:
      DATABASE_URL: postgres://inh:${POSTGRES_PASSWORD}@db:5432/inh
      MEDIA_ROOT: /app/media
    volumes:
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    command: python manage.py run_worker
    healthcheck:
      disable: true  # the image's check is for the web server, not the worker

volumes:
  pgdata:
  media:
